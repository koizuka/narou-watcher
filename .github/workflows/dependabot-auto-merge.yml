name: Dependabot auto-merge

# Enable auto-merge on Dependabot PRs except semver-major updates.
# The PR is merged only after the required status checks pass.
#
# Auto-merge is enabled with a GitHub App installation token instead of
# GITHUB_TOKEN: a merge performed on behalf of GITHUB_TOKEN does not trigger
# push workflows, so deploy-client / deploy-server would not run.
# Required Dependabot secrets (Settings > Secrets and variables > Dependabot):
#   AUTOMERGE_APP_CLIENT_ID   - Client ID of the GitHub App
#                               (Contents, Pull requests, Workflows: write;
#                               Workflows is needed to merge github-actions
#                               updates that touch .github/workflows/)
#   AUTOMERGE_APP_PRIVATE_KEY - Private key of the GitHub App

on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Create GitHub App token
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash "$PR_URL"
