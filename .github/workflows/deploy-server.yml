name: Deploy Server

on:
  push:
    branches: [ main ]
    paths:
    - '**.go'
    - 'go.sum'
    - 'go.mod'
    - '.github/workflows/deploy-server.yml'
  # Manual redeploy (e.g. after server-side changes). The deploy-server
  # environment only accepts runs from main.
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN; this workflow deploys over SSH and
# needs no GitHub API write access.
permissions:
  contents: read

# Never run two deploys at once; queue instead of cancelling a half-done deploy.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27"

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build -v -trimpath
      env:
        GOOS: "linux"
        GOARCH: "amd64"
        CGO_ENABLED: "0"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: narou-watcher
        path: narou-watcher
        retention-days: 7
        if-no-files-found: error

  # Only this job sees the SSH key. It runs no repository code: it uploads the
  # binary built above to the server's deploy gate, which validates it, swaps it
  # in, restarts the service and rolls back if it does not come up.
  # The key is restricted on the server to that single command
  # (authorized_keys: restrict,command="/usr/local/bin/narou-watcher-deploy").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: deploy-server
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: narou-watcher

    - name: Set up SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        # Pinned host key (no ssh-keyscan trust-on-first-use)
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

    - name: Deploy
      env:
        REMOTE: "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}"
      run: |
        echo "sha256: $(sha256sum narou-watcher | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
        ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
          "$REMOTE" narou-watcher-deploy deploy < narou-watcher

    - name: Remove SSH key
      if: always()
      run: rm -f ~/.ssh/deploy_key
